syntax = "proto3";

package media;

option java_package = "ink.x2.grpctest.grpc";
option java_multiple_files = true;

service MediaControlService {
    rpc Play(ControlRequest) returns (ControlResponse);
    rpc Pause(ControlRequest) returns (ControlResponse);
}

message ControlRequest {
}

message ControlResponse {
    bool success = 1;
    string message = 2;
}